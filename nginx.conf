# nginx config for the React single-page app (served by the unprivileged
# nginx image, which listens on 8080 and runs as a non-root user).
#
# In Kubernetes the cloud's Gateway sends /api and /socket.io straight to
# the API gateway service, so nginx only ever serves static files.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Basic browser security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Probe endpoint for Kubernetes (liveness + readiness).
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Files with a content hash in their name never change -> cache 1 year.
    location ~* ^/(js|css|images|fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: any other path (e.g. /product/abc) is a client-side
    # route, so return index.html and let React Router handle it. index.html
    # itself must not be cached, so new deployments are picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
